            - listitem [ref=e189]: Plugins & Skills
          - heading "Plugins & skills" [level=1] [ref=e191]
          - paragraph [ref=e193]: Extend agent capabilities, install third-party extension bundles, package custom workflow skills, and interface with Model Context Protocol (MCP) servers.
          - heading "The extensibility model" [level=2] [ref=e195]
          - paragraph [ref=e197]:
            - text: Antigravity CLI is designed for limitless customization. You can augment the shared agent harness by installing structured package modules called
            - strong [ref=e198]: Plugins
            - text: or creating localized markdown blueprints called
            - strong [ref=e199]: Skills
            - text: .
          - paragraph [ref=e201]: These customizations allow agents to access specialized proprietary commands, invoke domain-specific subagents, and consult customized style constraints.
          - heading "Antigravity plugins" [level=2] [ref=e203]
          - paragraph [ref=e205]: Plugins are namespaced bundles that package custom skills, background subagents, linting rules, Model Context Protocol definitions, and event hooks into a single deployable asset.
          - heading "Plugin filesystem structure" [level=3] [ref=e207]
          - paragraph [ref=e209]: "When you install or import a plugin, the CLI stages the bundle files within your global configuration path:"
          - generic [ref=e212]:
            - generic [ref=e214]: text
            - button "content_copy" [ref=e215] [cursor=pointer]
            - code [ref=e218]: ~/.gemini/antigravity-cli/plugins/<plugin_name>/
          - paragraph [ref=e220]: "A compliant plugin contains the following layout:"
          - generic [ref=e223]:
            - generic [ref=e225]: text
            - button "content_copy" [ref=e226] [cursor=pointer]
            - code [ref=e229]: "~/.gemini/antigravity-cli/plugins/<plugin_name>/ ├── plugin.json # Required package marker file ├── mcp_config.json # Optional Model Context Protocol servers ├── hooks.json # Optional pre/post tool event hooks ├── skills/ # Optional specialized skills directory ├── agents/ # Optional subagent definition templates └── rules/ # Optional custom codebase rules files"
          - heading "Managing plugins via CLI subcommands" [level=3] [ref=e231]
          - paragraph [ref=e233]:
            - text: The CLI exposes a
            - code [ref=e234]: plugin
            - text: (or plural
            - code [ref=e235]: plugins
            - text: ") subcommand pipeline to manage your extensions:"
          - list [ref=e237]:
            - listitem [ref=e238]:
              - generic [ref=e239]:
                - strong [ref=e240]: List installed plugins
                - text: ":"
              - text: Show active packages and their loaded components.
          - generic [ref=e243]:
            - button "content_copy" [ref=e244] [cursor=pointer]
            - code [ref=e247]: agy plugin list
          - list [ref=e249]:
            - listitem [ref=e250]:
              - generic [ref=e251]:
                - strong [ref=e252]: Install a local or remote plugin
                - text: ":"
              - text: Stage a package directory into your local profile.
          - generic [ref=e255]:
            - button "content_copy" [ref=e256] [cursor=pointer]
            - code [ref=e259]: agy plugin install /path/to/local/plugin
          - list [ref=e261]:
            - listitem [ref=e262]:
              - generic [ref=e263]:
                - strong [ref=e264]: Disable/Enable a plugin
                - text: ":"
              - text: Suspend a plugin's tools without deleting its assets.
          - generic [ref=e267]:
            - button "content_copy" [ref=e268] [cursor=pointer]
            - code [ref=e271]: agy plugin disable <plugin_name> agy plugin enable <plugin_name>
          - list [ref=e273]:
            - listitem [ref=e274]:
              - generic [ref=e275]:
                - strong [ref=e276]: Uninstall a plugin
                - text: ":"
              - text: Purge the package directory and clean up registries.
          - generic [ref=e279]:
            - button "content_copy" [ref=e280] [cursor=pointer]
            - code [ref=e283]: agy plugin uninstall <plugin_name>
          - heading "Agent skills" [level=2] [ref=e285]
          - paragraph [ref=e287]: Skills are declarative, human-readable markdown files that outline explicit instruction protocols, scripts, and target resources for specialized engineering tasks.
          - paragraph [ref=e289]:
            - text: Once registered,
            - strong [ref=e290]: Skills convert automatically into slash commands
            - text: inside the TUI, allowing you to invoke them manually (e.g., typing
            - code [ref=e291]: /refactor-ui
            - text: ).
          - heading "Creating local workspace skills" [level=3] [ref=e293]
          - paragraph [ref=e295]: "To deploy workspace-specific skills that stay with your git repository:"
          - list [ref=e297]:
            - listitem [ref=e298]:
              - generic [ref=e299]:
                - text: Create a directory named
                - code [ref=e300]: .agents/skills/
                - text: at your project root.
            - listitem [ref=e301]:
              - generic [ref=e302]:
                - text: Inside, draft a markdown file with a
                - code [ref=e303]: .md
                - text: extension (such as
                - code [ref=e304]: format-tests.md
                - text: ).
            - listitem [ref=e305]: "Define the skill's Frontmatter metadata:"
          - generic [ref=e308]:
            - button "content_copy" [ref=e309] [cursor=pointer]
            - code [ref=e312]: "--- name: format-tests description: Standardize and re-format Python unittest assertions ---"
          - list [ref=e314]:
            - listitem [ref=e315]:
              - generic [ref=e316]:
                - text: Below the metadata, write explicit instructions for the agent. When you run
                - code [ref=e317]: agy
                - text: in this directory, the skill is compiled, and
                - code [ref=e318]: /format-tests
                - text: becomes available in the prompt box.
          - heading "Sharing global skills" [level=3] [ref=e320]
          - paragraph [ref=e322]: "To share skills across all workspaces on your workstation, place the target markdown files inside your global configuration path:"
          - generic [ref=e325]:
            - generic [ref=e327]: text
            - button "content_copy" [ref=e328] [cursor=pointer]
            - code [ref=e331]: ~/.gemini/antigravity-cli/skills/
          - paragraph [ref=e333]:
            - text: Any markdown skill in this directory is automatically imported as a global slash command whenever you launch
            - code [ref=e334]: agy
            - text: in any directory.
          - heading "Managing hooks" [level=2] [ref=e336]
          - paragraph [ref=e338]:
            - text: Hooks intercept agent actions right before or immediately after execution. They are useful for running automated pre-flight checks or post-generation formats (such as running
            - code [ref=e339]: prettier
            - text: after writing files).
          - paragraph [ref=e341]:
            - text: Hooks are defined inside a plugin's
            - code [ref=e342]: hooks.json
            - text: or configured inside your primary
            - code [ref=e343]: settings.json
            - text: "file. You can inspect all loaded and active hooks inside the TUI by typing:"
          - generic [ref=e346]:
            - generic [ref=e348]: text
            - button "content_copy" [ref=e349] [cursor=pointer]
            - code [ref=e352]: /hooks
          - heading "Model Context Protocol (MCP)" [level=2] [ref=e354]
          - paragraph [ref=e356]: Model Context Protocol is an open standard enabling foundation models to interface securely with local APIs, file parsers, and custom developer tools.
          - paragraph [ref=e358]: Antigravity CLI supports both local processes and remote host MCP server configurations.
          - heading "Accessing the MCP manager" [level=3] [ref=e360]
          - paragraph [ref=e362]:
            - text: Type
            - code [ref=e363]: /mcp
            - text: inside the prompt panel and press
            - code [ref=e364]: Enter
            - text: to open the interactive
            - strong [ref=e365]: MCP Manager Overlay
            - text: ". This panel allows you to:"
          - list [ref=e367]:
            - listitem [ref=e368]: View live status rings for active, disconnected, or loading servers.
            - listitem [ref=e369]: Manually reload server configurations or check connection logs.
