          - heading "Visual rendering modes" [level=2] [ref=e260]
          - paragraph [ref=e262]: The TUI operates in one of two visual rendering modes depending on your terminal capability and connection latency.
          - 'heading "Alt-screen mode (`always`)" [level=3] [ref=e264]'
