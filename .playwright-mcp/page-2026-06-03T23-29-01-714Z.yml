          - heading "Getting Started with Antigravity and Gemini Enterprise Agent Platform" [level=1] [ref=e302]
          - paragraph [ref=e304]: This guide is for administrators setting up the Google Cloud environment to enable Antigravity integration with Gemini Enterprise Agent Platform. This integration allows enterprise developers to use Antigravity with models hosted in your own Google Cloud project, under Google Cloud Terms of Service, satisfying private networking and data residency requirements, and utilizing consumption-based billing.
          - heading "Basic Setup" [level=2] [ref=e306]
          - heading "Prerequisites" [level=3] [ref=e308]
