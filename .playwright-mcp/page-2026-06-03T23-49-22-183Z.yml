          - heading "Installation & auth" [level=1] [ref=e180]
          - paragraph [ref=e182]: Install Antigravity CLI, configure enterprise requirements, and establish secure authenticated sessions.
          - heading "Installation" [level=2] [ref=e184]
          - paragraph [ref=e186]: Antigravity CLI runs natively on macOS, Linux, and Windows. Use the platform-specific scripts below to install or upgrade the binary on your system.
          - heading "macOS and Linux" [level=3] [ref=e188]
          - paragraph [ref=e190]:
            - text: Execute the native installer script to download and install the executable to
            - code [ref=e191]: ~/.local/bin/agy
            - text: ":"
          - generic [ref=e194]:
            - generic [ref=e196]: bash
            - button "content_copy" [ref=e197] [cursor=pointer]
            - code [ref=e200]: curl -fsSL https://antigravity.google/cli/install.sh | bash
          - heading "Windows" [level=3] [ref=e202]
          - paragraph [ref=e204]:
            - text: The installation script registers the
            - code [ref=e205]: agy
            - text: "binary to your local user directory:"
            - code [ref=e206]: C:\Users\<Username>\AppData\Local\agy\bin
            - text: (where
            - code [ref=e207]: <Username>
            - text: represents your active Windows user profile).
          - paragraph [ref=e209]:
            - strong [ref=e210]: PowerShell
            - text: ": Open PowerShell and execute the following installation script:"
          - generic [ref=e213]:
            - generic [ref=e215]: powershell
            - button "content_copy" [ref=e216] [cursor=pointer]
            - code [ref=e219]: irm https://antigravity.google/cli/install.ps1 | iex
          - paragraph [ref=e221]:
            - strong [ref=e222]: CMD
            - text: ": Open a standard Command Prompt and execute:"
          - generic [ref=e225]:
            - generic [ref=e227]: cmd
            - button "content_copy" [ref=e228] [cursor=pointer]
            - code [ref=e231]: curl -fsSL https://antigravity.google/cli/install.cmd -o install.cmd && install.cmd && del install.cmd
          - heading "Installation flags" [level=3] [ref=e233]
          - paragraph [ref=e235]: "When executing the installation scripts, you can append the following customization flags:"
          - list [ref=e237]:
            - listitem [ref=e238]:
              - generic [ref=e239]:
                - code [ref=e240]: "--skip-aliases"
                - text: ": Bypasses shell profile alias purging (prevents the script from purging or updating legacy"
                - code [ref=e241]: agy
                - text: or
                - code [ref=e242]: antigravity
                - text: shell aliases).
            - listitem [ref=e243]:
              - generic [ref=e244]:
                - code [ref=e245]: "--skip-path"
                - text: ": Bypasses shell profile"
                - code [ref=e246]: PATH
                - text: appending (prevents the script from modifying your shell profile's dynamic environment variables).
          - heading "Authentication workflows" [level=2] [ref=e248]
          - paragraph [ref=e250]: Antigravity CLI uses secure credentials and token profiles to communicate with the shared agent harness.
          - heading "Local silent keyring sign-in" [level=3] [ref=e252]
          - paragraph [ref=e254]:
            - text: When launching
            - code [ref=e255]: agy
            - text: on your local machine, the CLI attempts to access your operating system's native secure keyring (such as Apple Keychain, Linux Secret Service/dbus, or Windows Credential Manager). If a valid token profile is found, the CLI authenticates your session silently without opening a browser.
          - paragraph [ref=e257]: "If no saved session is found:"
          - list [ref=e259]:
            - listitem [ref=e260]: The CLI automatically launches your local default web browser.
            - listitem [ref=e261]: Sign in using your approved account credentials.
          - heading "Remote SSH OAuth flow" [level=3] [ref=e263]
          - paragraph [ref=e265]: "When running over SSH, the CLI detects the remote connection environment. Because it cannot launch a local web browser, the CLI initiates a manual URL loop:"
          - list [ref=e267]:
            - listitem [ref=e268]:
              - generic [ref=e269]:
                - text: Launch
                - code [ref=e270]: agy
                - text: in your remote terminal session.
            - listitem [ref=e271]: The CLI detects the SSH environment and prints a unique, secure authorization URL.
            - listitem [ref=e272]: Copy this URL and paste it into a web browser on your local machine.
            - listitem [ref=e273]: Sign in with your approved credentials and complete the authentication.
            - listitem [ref=e274]: The browser displays a unique alphanumeric authorization code.
            - listitem [ref=e275]: Copy this code, return to your remote SSH terminal, and paste it into the prompt.
          - heading "Managing your session" [level=2] [ref=e277]
          - paragraph [ref=e279]: Terminating your session clears active credentials and local cache directories.
          - heading "Logging out" [level=3] [ref=e281]
          - paragraph [ref=e283]: "To disconnect your account and purge saved authentication profiles from your operating system's keyring, run the following command in the CLI prompt box:"
          - generic [ref=e286]:
            - generic [ref=e288]: text
            - button "content_copy" [ref=e289] [cursor=pointer]
            - code [ref=e292]: /logout
