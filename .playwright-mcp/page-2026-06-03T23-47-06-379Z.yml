          - heading "Migrating from Gemini CLI" [level=1] [ref=e180]
          - paragraph [ref=e182]: Convert your legacy configurations, import Gemini CLI extensions as native plugins, adapt custom skills paths, and reformat Model Context Protocol configurations.
          - heading "Overview" [level=2] [ref=e184]
          - paragraph [ref=e186]: Antigravity CLI preserves backward compatibility with the core developer-experience constructs popularized by Gemini CLI. To ensure a seamless upgrade, the CLI offers automatic onboarding conversion alongside explicit CLI migration command sequences.
          - heading "First-launch onboarding" [level=2] [ref=e188]
          - paragraph [ref=e190]:
            - text: When you execute
            - code [ref=e191]: agy
            - text: "for the first time in an environment containing legacy configurations, the CLI automatically detects your existing profiles. An interactive checklist prompts you to choose which assets to migrate:"
          - list [ref=e193]:
            - listitem [ref=e194]:
              - generic [ref=e195]:
                - strong [ref=e196]: Auto-conversion
                - text: ":"
              - text: Select the extensions and global configurations you wish to convert.
            - listitem [ref=e197]:
              - generic [ref=e198]:
                - strong [ref=e199]: Keyring storage
                - text: ":"
              - text: The CLI migrates your active session tokens securely into your operating system's native keyring storage.
            - listitem [ref=e200]:
              - generic [ref=e201]:
                - strong [ref=e202]: Settings alignment
                - text: ":"
              - text: Default visual parameters and rendering buffers map automatically to your new settings profile.
          - generic [ref=e204]:
            - generic [ref=e205]: info
            - generic [ref=e206]:
              - strong [ref=e207]: Partial Parity
              - text: ": While we preserve support for workspace skills, rules, and MCP servers, certain customized terminal themes or experimental visual overlays from Gemini CLI may not be supported."
          - heading "Converting extensions to plugins" [level=2] [ref=e209]
          - paragraph [ref=e211]:
            - text: Since Gemini CLI launched, the industry has standardized on the term
            - strong [ref=e212]: plugins
            - text: ". You can manually convert your legacy Gemini extensions to native Antigravity plugins by executing:"
