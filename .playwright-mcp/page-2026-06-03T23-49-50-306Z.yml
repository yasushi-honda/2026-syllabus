          - paragraph [ref=e225]: "---"
          - heading "Configure your shell PATH" [level=2] [ref=e227]
          - heading "Symptom" [level=3] [ref=e229]
          - paragraph [ref=e231]:
            - text: Executing
            - code [ref=e232]: agy
            - text: "returns a shell terminal error:"
          - generic [ref=e235]:
            - generic [ref=e237]: bash
            - button "content_copy" [ref=e238] [cursor=pointer]
            - code [ref=e241]: "bash: agy: command not found"
          - heading "Cause" [level=3] [ref=e243]
          - paragraph [ref=e245]:
            - text: The installation utility downloads the binary to
            - code [ref=e246]: ~/.local/bin
            - text: (or
            - code [ref=e247]: C:\Users\<Username>\AppData\Local\agy\bin
            - text: ), but your shell's active
            - code [ref=e248]: $PATH
            - text: environment does not index this directory.
          - heading "Resolution" [level=3] [ref=e250]
          - paragraph [ref=e252]: Ensure your terminal session loads the binary path.
          - paragraph [ref=e254]:
            - strong [ref=e255]: macOS & Linux
            - text: ":"
          - list [ref=e257]:
            - listitem [ref=e258]:
              - generic [ref=e259]:
                - text: Open your shell configuration file (
                - code [ref=e260]: ~/.bashrc
                - text: or
                - code [ref=e261]: ~/.zshrc
                - text: ).
            - listitem [ref=e262]: "Verify or append the following line at the end of the file:"
          - generic [ref=e265]:
            - button "content_copy" [ref=e266] [cursor=pointer]
            - code [ref=e269]: export PATH="~/.local/bin:$PATH"
          - list [ref=e271]:
            - listitem [ref=e272]: "Reload your profile configurations:"
          - generic [ref=e275]:
            - button "content_copy" [ref=e276] [cursor=pointer]
            - code [ref=e279]: source ~/.zshrc
          - paragraph [ref=e281]:
            - strong [ref=e282]: Windows (PowerShell)
            - text: ":"
          - list [ref=e284]:
            - listitem [ref=e285]: "Open a PowerShell terminal as an Administrator and execute:"
          - generic [ref=e288]:
            - button "content_copy" [ref=e289] [cursor=pointer]
            - code [ref=e292]: "[System.Environment]::SetEnvironmentVariable(\"Path\", [System.Environment]::GetEnvironmentVariable(\"Path\", \"User\") + \";C:\\Program Files\\Google\\antigravity-cli\", \"User\")"
          - list [ref=e294]:
            - listitem [ref=e295]: Restart your terminal emulator for the system registry environment to refresh.
          - paragraph [ref=e297]: "---"
          - heading "Authorize keyring permissions" [level=2] [ref=e299]
          - heading "Symptom" [level=3] [ref=e301]
          - paragraph [ref=e303]: "When launching, the CLI hangs, prints DBUS warnings, or throws keyring access exceptions:"
          - generic [ref=e306]:
            - generic [ref=e308]: text
            - button "content_copy" [ref=e309] [cursor=pointer]
            - code [ref=e312]: "Error: failed to retrieve token: secret keyring is locked"
          - heading "Cause" [level=3] [ref=e314]
          - paragraph [ref=e316]: Antigravity CLI utilizes secure keychain libraries (Apple Keychain, Linux secret-service via dbus, or Windows Credential Manager) to encrypt your session tokens. If the background daemon is locked or headless, the CLI cannot read credentials.
          - heading "Resolution" [level=3] [ref=e318]
          - paragraph [ref=e320]:
            - strong [ref=e321]: macOS
            - text: ":"
          - list [ref=e323]:
            - listitem [ref=e324]:
              - generic [ref=e325]:
                - text: Open
                - strong [ref=e326]: Keychain Access
                - text: app.
            - listitem [ref=e327]:
              - generic [ref=e328]:
                - text: Search for the
                - code [ref=e329]: Antigravity CLI
                - text: security item.
            - listitem [ref=e330]:
              - generic [ref=e331]:
                - text: Right-click, select
                - strong [ref=e332]: Get Info
                - text: ", choose the"
                - strong [ref=e333]: Access Control
                - text: tab, and verify that
                - code [ref=e334]: agy
                - text: is on the allowed applications list.
            - listitem [ref=e335]: "If running inside a headless SSH session on Mac, run the following unlock sequence:"
          - generic [ref=e338]:
            - button "content_copy" [ref=e339] [cursor=pointer]
            - code [ref=e342]: security unlock-keychain -p "your_keychain_password" login.keychain
          - paragraph [ref=e344]:
            - strong [ref=e345]: Linux
            - text: ":"
          - paragraph [ref=e347]: Ensure your system keyring (such as GNOME Keyring or KWallet) is unlocked and accessible.
          - paragraph [ref=e349]: "If you are running in a headless environment or over SSH, ensure that a D-Bus session is active and that your keyring daemon is running. You can typically initialize a D-Bus session by running:"
          - generic [ref=e352]:
            - generic [ref=e354]: bash
            - button "content_copy" [ref=e355] [cursor=pointer]
            - code [ref=e358]: export $(dbus-launch)
          - paragraph [ref=e360]: If you still experience access issues, ensure your user account has the necessary permissions to access the keyring service or reach out to support.
          - paragraph [ref=e362]: "---"
          - heading "Enable emulator clipboard forwarding" [level=2] [ref=e364]
          - heading "Symptom" [level=3] [ref=e366]
          - paragraph [ref=e368]:
            - text: Pasting screenshots or media files via
            - code [ref=e369]: Ctrl+V
            - text: "within an SSH terminal returns a failure notification:"
          - generic [ref=e372]:
            - generic [ref=e374]: text
            - button "content_copy" [ref=e375] [cursor=pointer]
            - code [ref=e378]: "Error: local pasteboard is empty or unreachable over SSH connection"
          - heading "Cause" [level=3] [ref=e380]
          - paragraph [ref=e382]: Standard SSH streams do not forward graphical clipboards. Graphic uploads require specific terminal multiplexer protocols.
          - heading "Resolution" [level=3] [ref=e384]
          - paragraph [ref=e386]: Verify that you are utilizing supported terminal emulators and configurations.
          - list [ref=e388]:
            - listitem [ref=e389]:
              - generic [ref=e390]:
                - strong [ref=e391]: Use iTerm2 or Ghostty
                - text: ":"
              - text: These emulators support advanced clip channels.
            - listitem [ref=e392]:
              - generic [ref=e393]:
                - strong [ref=e394]: Configure iTerm2 Forwarding
                - text: ":"
          - list [ref=e396]:
            - listitem [ref=e397]:
              - generic [ref=e398]:
                - text: Open iTerm2 Preferences (
                - code [ref=e399]: Cmd+,
                - text: ).
            - listitem [ref=e400]:
              - generic [ref=e401]:
                - text: Go to the
                - strong [ref=e402]: General
                - text: tab, select
                - strong [ref=e403]: Selection
                - text: submenu.
            - listitem [ref=e404]:
              - generic [ref=e405]:
                - text: Check
                - strong [ref=e406]: Applications in terminal may access clipboard
                - text: (enabling OSC 52 write channels).
          - list [ref=e408]:
            - listitem [ref=e409]:
              - generic [ref=e410]:
                - strong [ref=e411]: Bypass Multiplexers
                - text: ":"
              - generic [ref=e412]:
                - text: If running inside
                - code [ref=e413]: tmux
                - text: ", ensure your active configuration maps standard paste clips correctly:"
          - generic [ref=e416]:
            - button "content_copy" [ref=e417] [cursor=pointer]
            - code [ref=e420]: set -s set-clipboard on
          - paragraph [ref=e422]: "---"
          - heading "Resolve self-updater locks and failures" [level=2] [ref=e424]
          - heading "Symptom" [level=3] [ref=e426]
          - paragraph [ref=e428]:
            - text: Launching
            - code [ref=e429]: agy
            - text: "hangs, fails to apply upgrades, or returns an advisory lock warning:"
          - generic [ref=e432]:
            - generic [ref=e434]: text
            - button "content_copy" [ref=e435] [cursor=pointer]
            - code [ref=e438]: "Warning: another background updater process is already active (update.lock)"
          - heading "Cause" [level=3] [ref=e440]
          - paragraph [ref=e442]:
            - text: Antigravity CLI contains a native, statically linked self-updater that runs in the background. It uses a 15-minute Time-To-Live (TTL) debounce marker (
            - code [ref=e443]: last_check.timestamp
            - text: ) and an advisory lock (
            - code [ref=e444]: update.lock
            - text: ) inside
            - code [ref=e445]: ~/.gemini/antigravity-cli/updater/
            - text: to prevent concurrent process collisions. If a background updater process hangs, crashes without releasing the lock, or has insufficient user filesystem permissions inside the executable directory, subsequent updates are blocked.
          - heading "Resolution" [level=3] [ref=e447]
          - list [ref=e449]:
            - listitem [ref=e450]:
              - generic [ref=e451]:
                - strong [ref=e452]: Release the advisory lock
                - text: ":"
              - text: "Purge the background lock file manually:"
          - generic [ref=e455]:
            - button "content_copy" [ref=e456] [cursor=pointer]
            - code [ref=e459]: rm -f ~/.gemini/antigravity-cli/updater/update.lock
          - list [ref=e461]:
            - listitem [ref=e462]:
              - generic [ref=e463]:
                - strong [ref=e464]: Opt-out/Disable auto-updates
                - text: ":"
              - generic [ref=e465]:
                - text: Set the
                - code [ref=e466]: AGY_CLI_DISABLE_AUTO_UPDATE
                - text: environment variable to
                - code [ref=e467]: "true"
                - text: inside your shell profile (
                - code [ref=e468]: ~/.bashrc
                - text: or
                - code [ref=e469]: ~/.zshrc
                - text: "):"
          - generic [ref=e472]:
            - button "content_copy" [ref=e473] [cursor=pointer]
            - code [ref=e476]: export AGY_CLI_DISABLE_AUTO_UPDATE=true
          - list [ref=e478]:
            - listitem [ref=e479]:
              - generic [ref=e480]:
                - strong [ref=e481]: Verify directory write permissions
                - text: ":"
              - generic [ref=e482]:
                - text: Ensure your user profile owns and has write permissions inside the target installation directory (
                - code [ref=e483]: ~/.local/bin/
                - text: on Unix, or
                - code [ref=e484]: "%LOCALAPPDATA%\\agy\\bin"
                - text: on Windows).
          - paragraph [ref=e486]: "---"
