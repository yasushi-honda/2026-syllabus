      - generic [ref=e278]: "# プロンプト改善ワークシート(NotebookLM 用) > このシートは「自分だけのAI」の 6 つ目のソースとして使います。 > これまでの【学習データ①〜⑤】と組み合わせて、AI が「私が次にプロンプトを書くとき何を確認すべきか」を 4 要素フレームで返せるようになります。 > 個人情報(本名・住所・電話番号・学籍番号など)は書かないこと。書ける範囲で OK・空欄でも OK。 ## ① 4 要素チェックリスト プロンプトを書くとき自分が必ず確認する 4 要素を、自分の言葉で 1〜2 行ずつ説明する。教科書の引き写しではなく、**自分が次に思い出せる書き方**で。 **役割(ペルソナ)**: AI に「誰として答えてほしいか」を伝える指定。 (例: 自分の言葉で書く) → **目的**: 誰に向けて・何のために・どんな場面で使う応答が欲しいか。 (例: 自分の言葉で書く) → **制約**: 出力形式・文字数・トーン(話し言葉/書き言葉/敬語/カジュアル など)の縛り。 (例: 自分の言葉で書く) → **例(few-shot)**: 「こんな感じで書いてほしい」という参考の文・トーンサンプル。 (例: 自分の言葉で書く) → ## ② 段階的改善の手順(A → B → C) 1 回目で物足りない応答が来たとき、どの順番で要素を足していくかを自分の言葉で。 **A: あいまいな最初の一文** 何が起きやすいか、どんな応答が返ってきがちかを 1〜2 行で。 (例: 自分の言葉で書く) → **B: 役割と目的と制約を足す** A に対して何を加えると、応答がどう変わると期待できるかを 1〜2 行で。 (例: 自分の言葉で書く) → **C: 自分の情報と例を足す** B に対して何を加えると、応答が「自分用」に寄ると期待できるかを 1〜2 行で。 (例: 自分の言葉で書く) → ## ③ 今日の 3 パターン比較 2 限前半で選んだ自分のテーマで作った A・B・C のプロンプトと応答の差を整理する。 **選んだテーマ**: (例: 「来月の文化祭で配るチラシのキャッチコピーを 3 案考えて」) → **パターン A のプロンプト**: → **パターン A の応答の最初の 3 行**: → **パターン B のプロンプト**: → **パターン B の応答の最初の 3 行**: → **パターン C のプロンプト**: → **パターン C の応答の最初の 3 行**: → **自分が一番使えると思った応答はどれか(A/B/C)・その理由**: → **A → B、B → C の 1 ステップごとに変わった点(1〜2 行ずつ)**: - A → B: - B → C: ## ④ 次に試したい改善案(パターン D を作るなら) もしもう一段プロンプトを育てるとしたら、次に何を足す/削るか。 - 足したい要素: - 削りたい要素: - そう考えた理由(1〜2 行): → ## ⑤ 自分の決まり文句テンプレ(役割設定) 自分がよく書きそうな役割設定(ペルソナ)を 3〜5 個リスト化しておく。次にプロンプトを書くときの下敷きとして使う。 - 役割テンプレ 1: (例: 「あなたはキャリア支援の先生です」) - 役割テンプレ 2: - 役割テンプレ 3: - 役割テンプレ 4(任意): - 役割テンプレ 5(任意): ## メモ(自由記入) 今日のプロンプト改善学習で気づいたこと・引っかかったこと・次に試したいこと。空欄でも OK。 (例: 「制約を箇条書きにすると応答が揃いやすかった」「例を 1 つ渡しただけで口調が大きく寄った」) →"
